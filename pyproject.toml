[project]
name = "unienv_tianji"
version = "0.0.1a1"
requires-python = ">= 3.10"
dependencies = [
    "unienv",
    "numpy",
    "mujoco",
    "mink",
    "osqp",
    "xbarray",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/unienv-tianji"
Documentation = "https://github.com/UniEnvOrg/unienv-tianji"
Repository = "https://github.com/UniEnvOrg/unienv-tianji"
Issues = "https://github.com/UniEnvOrg/unienv-tianji/issues"
Changelog = "https://github.com/UniEnvOrg/unienv-tianji/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*"]

[tool.setuptools.package-data]
"unienv_tianji" = [
    "sdk/*.MvKDCfg",
    "sdk/SDK_PYTHON/*.so",
    "sdk/SDK_PYTHON/*.dll",
    "assets/*.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]